<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1FAA7E"/>
      <stop offset="100%" stop-color="#147A5B"/>
    </linearGradient>
    <linearGradient id="case" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E8F0EC"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <!-- Briefcase body -->
  <rect x="100" y="200" width="230" height="170" rx="22" fill="url(#case)" opacity="0.95"/>
  <!-- Briefcase handle -->
  <path d="M180 200 v-30 a30 30 0 0 1 30-30 h10 a30 30 0 0 1 30 30 v30" fill="none" stroke="#fff" stroke-width="16" stroke-linecap="round" opacity="0.95"/>
  <!-- Briefcase clasp/stripe -->
  <rect x="100" y="260" width="230" height="18" fill="#1D9E75" opacity="0.3"/>
  <circle cx="215" cy="269" r="10" fill="#1D9E75" opacity="0.5"/>
  <!-- Combination star burst (alchemy transmutation symbol) -->
  <g transform="translate(340, 170)">
    <!-- Outer glow -->
    <circle cx="0" cy="0" r="80" fill="#FFD700" opacity="0.15"/>
    <!-- 6-pointed star made of two triangles -->
    <polygon points="0,-62 18,-20 62,-20 26,8 36,52 0,28 -36,52 -26,8 -62,-20 -18,-20"
             fill="#FFD700" opacity="0.9"/>
    <!-- Inner circle with plus (combination) -->
    <circle cx="0" cy="0" r="22" fill="#FFF" opacity="0.95"/>
    <rect x="-9" y="-2.5" width="18" height="5" rx="1.5" fill="#D4A017"/>
    <rect x="-2.5" y="-9" width="5" height="18" rx="1.5" fill="#D4A017"/>
  </g>
  <!-- Small sparkle accents -->
  <circle cx="120" cy="400" r="4" fill="#fff" opacity="0.4"/>
  <circle cx="400" cy="360" r="3" fill="#FFD700" opacity="0.5"/>
  <circle cx="160" cy="130" r="3" fill="#fff" opacity="0.35"/>
</svg>
