<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1D9E75"/>
      <stop offset="100%" stop-color="#14795A"/>
    </linearGradient>
    <linearGradient id="liquid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A8E6CF"/>
      <stop offset="100%" stop-color="#5BCFA4"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <!-- Flask body -->
  <path d="M206 140 h100 v90 l72 120 c12 20-2 46-26 46H160c-24 0-38-26-26-46l72-120z"
        fill="#fff" opacity="0.95"/>
  <!-- Flask neck -->
  <rect x="216" y="110" width="80" height="40" rx="6" fill="#fff" opacity="0.95"/>
  <!-- Liquid inside flask -->
  <path d="M196 310 l46-76 h28 l46 76 c8 14-1 30-17 30H213c-16 0-25-16-17-30z"
        fill="url(#liquid)" opacity="0.9"/>
  <!-- Bubbles in liquid -->
  <circle cx="240" cy="310" r="8" fill="#fff" opacity="0.5"/>
  <circle cx="272" cy="320" r="5" fill="#fff" opacity="0.4"/>
  <circle cx="255" cy="295" r="6" fill="#fff" opacity="0.35"/>
  <!-- Sparkles -->
  <g fill="#FFD700">
    <polygon points="370,120 376,138 394,138 379,149 385,167 370,156 355,167 361,149 346,138 364,138" opacity="0.95"/>
    <polygon points="140,180 144,192 156,192 146,199 150,211 140,204 130,211 134,199 124,192 136,192" opacity="0.8" transform="scale(0.8) translate(30,40)"/>
    <polygon points="390,230 394,242 406,242 396,249 400,261 390,254 380,261 384,249 374,242 386,242" opacity="0.7" transform="scale(0.7) translate(120,20)"/>
  </g>
  <!-- Plus sign on flask -->
  <rect x="249" y="160" width="14" height="40" rx="3" fill="#1D9E75" opacity="0.35"/>
  <rect x="239" y="170" width="34" height="14" rx="3" fill="#1D9E75" opacity="0.35"/>
</svg>
